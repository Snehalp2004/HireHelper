<h2>Task Feed</h2>

<div class="feed-container">

  <h2 class="feed-title">Available Tasks</h2>

  <div *ngIf="loading" class="loading">
    Loading tasks...
  </div>

  <div *ngIf="!loading && tasks.length === 0" class="empty">
    No tasks available
  </div>

  <div class="task-grid">

    <div class="task-card" *ngFor="let task of tasks">

      <div class="task-header">
        <h3>{{ task.title }}</h3>
        <span class="budget">₹ {{ task.budget }}</span>
      </div>

      <p class="description">
        {{ task.description }}
      </p>

      <div class="task-footer">
        <span class="category">{{ task.category || 'General' }}</span>

        <button class="request-btn" (click)="sendRequest(task.id)">
          Request
        </button>
      </div>

    </div>

  </div>

</div>
<span class="status active">Active</span>

<div class="feed-filters">
  <button>All</button>
  <button>Web</button>
  <button>Home</button>
</div>

<input type="text" placeholder="Search tasks..." class="search-bar">
