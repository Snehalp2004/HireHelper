<div class="feed-page">

<h2 class="feed-title">Task Feed</h2>

<div *ngIf="loading" class="loading-box">
Loading tasks...
</div>

<div *ngIf="!loading && message" class="message-box">
{{ message }}
</div>

<div *ngIf="!loading && tasks.length > 0" class="feed-container">

  <div *ngFor="let task of tasks" class="task-card">

    <h3>{{ task.title }}</h3>

    <p><b>Description:</b> {{ task.description || '-' }}</p>

    <p><b>Location:</b> {{ task.loc || '-' }}</p>

    <p><b>Start Time:</b> {{ task.start_time | date:'short' }}</p>

    <span class="status">
      {{ task.status || 'OPEN' }}
    </span>

    <br>

    <button class="request-btn"
    (click)="requestTask(task)">
    Request
    </button>

  </div>

</div>

</div>
